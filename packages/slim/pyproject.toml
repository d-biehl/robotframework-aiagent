[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project]
name = "robotframework-aiagent-slim"
version = "0.3.0"
description = "Robot Framework AI Agent core library"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "robotframework>=7.0",
    "pydantic-ai-slim>=1.103.0",
    "typing-extensions>=4.14.0",
]

[project.optional-dependencies]
# models
openai = ["pydantic-ai-slim[openai]"]
cohere = ["pydantic-ai-slim[cohere]"]
vertexai = ["pydantic-ai-slim[vertexai]"]
google = ["pydantic-ai-slim[google]"]
anthropic = ["pydantic-ai-slim[anthropic]"]
groq = ["pydantic-ai-slim[groq]"]
mistral = ["pydantic-ai-slim[mistral]"]
bedrock = ["pydantic-ai-slim[bedrock]"]
huggingface = ["pydantic-ai-slim[huggingface]"]
openrouter = ["pydantic-ai-slim[openrouter]"]
# tools
duckduckgo = ["pydantic-ai-slim[duckduckgo]"]
mcp = ["pydantic-ai-slim[mcp]"]

[tool.uv.build-backend]
# AIAgent is a namespace package shared with the other workspace members
# (AIAgent/Models has no __init__.py either), so ship the whole tree as is
module-name = "AIAgent"
namespace = true
