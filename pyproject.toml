[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project]
name = "robotframework-aiagent"
version = "0.4.1"
description = "A Robot Framework library for AI agents"
readme = "README.md"
authors = [{ name = "Daniel Biehl", email = "dbiehl@live.de" }]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "robotframework-aiagent-slim[openai,google,groq,anthropic,mistral,cohere,bedrock,openrouter,mcp]==0.4.1",
]

[project.optional-dependencies]
examples = ["robotframework-aiagent-examples==0.4.1"]

[project.urls]
Source = "https://github.com/d-biehl/robotframework-aiagent"
Changelog = "https://github.com/d-biehl/robotframework-aiagent/releases"

[dependency-groups]
dev = [
    "commitizen>=4.19.3",
    "debugpy>=1.8.22",
    "mypy>=2.4.1",
    "robotcode[runner]>=2.8.0",
    "robotframework-robocop>=9.1.2",
    "ruff>=0.17.3",
]

[tool.uv]
required-version = ">=0.13.6"

[tool.uv.sources]
robotframework-aiagent-slim = { workspace = true }
robotframework-aiagent-examples = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "examples"]

[tool.uv.build-backend]
# meta package: no Python modules, only metadata and dependencies
module-name = []


[tool.ruff]
line-length = 120
target-version = "py311"
include = [
    "packages/**/*.py",
    "examples/**/*.py",
    "tests/**/*.py",
    "docs/**/*.py",
]

[tool.ruff.lint]
extend-select = [
    "Q",
    "RUF100",
    "RUF018", # https://docs.astral.sh/ruff/rules/assignment-in-assert/
    "C90",
    "UP",
    "I",
    "D",
    "TID251",
]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
mccabe = { max-complexity = 15 }
ignore = [
    "D100", # ignore missing docstring in module
    "D102", # ignore missing docstring in public method
    "D104", # ignore missing docstring in public package
    "D105", # ignore missing docstring in magic methods
    "D107", # ignore missing docstring in __init__ methods
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["AIAgent"]
# weird issue with ruff thinking fasta2a is still editable
known-third-party = ["robot", "pydantic_ai"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TypedDict".msg = "Use typing_extensions.TypedDict instead."

[tool.ruff.format]
docstring-code-format = false
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["D101", "D103"]
"tests/**/*.py" = ["D"]
"docs/**/*.py" = ["D"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnnecessaryIsInstance = false
reportUnnecessaryTypeIgnoreComment = true
reportMissingModuleSource = false
reportUnknownVariableType = false
reportUntypedClassDecorator = false
reportUnknownParameterType = false
reportUnknownMemberType = false
include = ["packages", "examples"]
venvPath = '.'
venv = ".venv"

[tool.mypy]
python_version = "3.11"
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
implicit_reexport = false
implicit_optional = true
disallow_untyped_decorators = false
disallow_subclassing_any = false
explicit_package_bases = true
namespace_packages = true
exclude = [
    '^\.mypy_cache/',
    '^\.venv.*/',
    "^build/",
    "^dist/",
    "^out/",
    "^playground/",
]
mypy_path = ["typings", "src", "packages/slim/src"]


[[tool.mypy.overrides]]
module = ["robot.*"]
ignore_missing_imports = true
no_implicit_reexport = false

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "uv"
# all workspace packages share one version and pin each other exactly
version_files = [
    "packages/slim/pyproject.toml:^version",
    "packages/verify/pyproject.toml:^version",
    "examples/pyproject.toml:^version",
    "pyproject.toml:robotframework-aiagent-.*==",
    "examples/pyproject.toml:robotframework-aiagent-slim.*==",
    "packages/verify/pyproject.toml:robotframework-aiagent-slim.*==",
]
pre_bump_hooks = ["uv lock"]
update_changelog_on_bump = true
major_version_zero = true
changelog_incremental = true
changelog_merge_prerelease = true
gpg_sign = true
annotated_tag = true
bump_message = "chore(release): bump version $current_version → $new_version"
