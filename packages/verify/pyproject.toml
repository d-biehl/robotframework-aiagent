[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project]
name = "robotframework-aiagent-verify"
version = "0.3.0"
description = "LLM-as-judge verification keywords for robotframework-aiagent"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["robotframework-aiagent-slim==0.3.0"]

[tool.uv.sources]
robotframework-aiagent-slim = { workspace = true }

[tool.uv.build-backend]
module-name = "AIAgent.Verify"
